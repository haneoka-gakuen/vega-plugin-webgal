name: Publish

on:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write

jobs:
  npm:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          path: vega-plugin-webgal
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: haneoka-gakuen/vega
          path: vega-plugin-webgal/.dependencies/vega
          persist-credentials: false
          ref: 2fa1b39c1176852db38a45b453c737e8e3439f5d
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271
        with:
          version: 11.14.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - working-directory: vega-plugin-webgal
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: node scripts/verify-release-tag.mjs
      - working-directory: vega-plugin-webgal
        run: pnpm install --no-frozen-lockfile
      - working-directory: vega-plugin-webgal
        run: |
          pnpm --filter @haneoka/vega-protocol build
          pnpm --filter @haneoka/vega build:core
      - working-directory: vega-plugin-webgal
        run: pnpm check
      - working-directory: vega-plugin-webgal
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          package_name=$(node -p "require('./package.json').name.replaceAll('/', '-')")
          package_dir="$RUNNER_TEMP/$package_name"
          mkdir -p "$package_dir"
          pnpm pack --pack-destination "$package_dir"
          npm publish "$package_dir"/*.tgz --access public --provenance
